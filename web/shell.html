<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Bomberman</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #fff; }
    main { width: min(96vw, 960px); text-align: center; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; outline: none; }
    p { margin: .75rem 0 0; color: #cbd1dc; }
    #status { color: #f3d37a; }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" width="640" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <p id="status">Loading game assets…</p>
    <p>Arrow keys / WASD to move · Space to jump or select · B to place a bomb · P / Esc to pause</p>
  </main>
  <script>
    var statusElement = document.getElementById("status");
    var Module = {
      canvas: document.getElementById("canvas"),
      setStatus: function (text) {
        statusElement.textContent = text || "Click the game and press a key to play";
      },
      monitorRunDependencies: function (left) {
        if (left === 0) statusElement.textContent = "Click the game and press a key to play";
      }
    };
    Module.canvas.addEventListener("pointerdown", function () { Module.canvas.focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
