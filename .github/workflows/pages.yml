name: Build and deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build WebAssembly game
        run: docker run --rm -v "$PWD:/src" -w /src/2DGame/02-Bubble emscripten/emsdk:3.1.64 make web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 2DGame/02-Bubble/web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
